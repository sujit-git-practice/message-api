name: Build, Push and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  GCP_REGION: europe-north1
  IMAGE_NAME: message-api
  # Must match the Artifact Registry repository_id created by the
  # gcp-infra module.message_artifact_registry ("microservices").
  REPOSITORY: microservices
  GKE_CLUSTER: message-gke
  K8S_REPO: sujit-git-practice/gcp-microservices-k8s
  HELM_CHART_PATH: gcp-microservices-k8s/k8s/helm/message

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ github.sha }}
      image-repo: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::error::GCP_PROJECT_ID secret is not set. Add it under Settings > Secrets and variables > Actions (repository secret) or under the 'dev' environment secrets."
            exit 1
          fi

      - name: Build and push (dev)
        run: |
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Checkout k8s manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K8S_REPO }}
          path: gcp-microservices-k8s

      - name: Get GKE credentials (dev)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to GKE (dev) via Helm
        run: |
          helm upgrade --install message ${{ env.HELM_CHART_PATH }} \
            --namespace message-dev \
            --create-namespace \
            -f ${{ env.HELM_CHART_PATH }}/values.yaml \
            -f ${{ env.HELM_CHART_PATH }}/values-dev.yaml \
            --set image.repository=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }}

